<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src https://audio-ssl.itunes.apple.com; connect-src 'self' https://itunes.apple.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Song Timeline</title>
  <meta name="theme-color" content="#f5ecdc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Timeline">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rotate" role="alert"><div class="ico" aria-hidden="true">📱↻</div><p><b>Rotate your phone</b><br>Song Timeline is played in landscape.</p></div>
  <main>
    <!-- SETUP -->
    <section id="setup" class="screen">
      <h1>Song Timeline</h1>
      <p class="muted">Hear a song, place it in your timeline by release year.</p>
      <form id="setup-form" autocomplete="off">
        <label>Mode
          <select id="mode">
            <option value="solo">Solo</option>
            <option value="group">Group (pass the phone)</option>
          </select>
        </label>
        <label id="players-row" hidden>Players
          <input id="players" type="number" min="2" max="6" value="2" inputmode="numeric">
        </label>
        <label>Cards to win
          <input id="target" type="number" min="2" max="20" value="10" inputmode="numeric">
        </label>
        <p id="setup-error" class="error" role="alert"></p>
        <button id="start" type="submit" class="primary" disabled>Start</button>
      </form>
    </section>

    <!-- PLAY (landscape phone layout: timeline left, mystery song + actions right) -->
    <section id="play" class="screen" hidden>
      <div id="board" class="board">
        <section id="active" class="active" aria-label="Active player's timeline">
          <div class="top">
            <h2 id="turn-name" class="sr"></h2>
            <div id="active-head" class="player-head"></div>
            <aside id="others" class="others" aria-label="Other players"></aside>
            <button id="quit" type="button" class="link">Quit</button>
          </div>
          <div class="time-arrow">
            <div class="rib">
              <button id="arrow-from" type="button" class="end" aria-label="Jump to the oldest card"></button>
              <span aria-hidden="true">Time</span>
              <button id="arrow-to" type="button" class="end" aria-label="Jump to the newest card"></button>
            </div>
            <div class="tip" aria-hidden="true"></div>
          </div>
          <ol id="timeline" class="timeline" aria-label="Timeline, earliest first"></ol>
        </section>

        <aside id="panel" class="panel">
          <div id="mystery" class="card mystery">
            <div class="qmark" aria-hidden="true">?</div>
            <button id="play-btn" type="button" class="primary" disabled>Loading…</button>
            <p id="audio-status" class="muted small" aria-live="polite"></p>
          </div>

          <div id="reveal" class="card reveal" hidden>
            <h3 id="reveal-result"></h3>
            <p id="reveal-song" class="song"></p>
            <p id="reveal-year" class="year"></p>
            <ul id="reveal-notes" class="notes"></ul>
          </div>

          <!-- Actions sit at the bottom of the right column (thumb zone) -->
          <div id="actions" class="actions">
            <div id="challenge-box" class="card" hidden>
              <p id="challenge-text" class="small"></p>
              <div id="challenge-btns" class="stack"></div>
            </div>
            <p id="hint" class="muted small" aria-live="polite"></p>
            <button id="submit-btn" type="button" class="primary" disabled>Reveal answer</button>
            <button id="claim-btn" type="button" hidden title="Guessed song and artist correctly: claim a challenge card" aria-label="Claim a challenge card (guessed song and artist correctly)">+🃏</button>
            <button id="next-btn" type="button" class="primary" hidden>Next</button>
          </div>
        </aside>
      </div>
    </section>

    <!-- END -->
    <section id="end" class="screen" hidden>
      <h1 id="end-title"></h1>
      <ul id="end-stats" class="score"></ul>
      <button id="again" type="button" class="primary">Play again</button>
    </section>

  </main>
  <audio id="audio" preload="none"></audio>
  <script type="module" src="app.js"></script>
</body>
</html>
